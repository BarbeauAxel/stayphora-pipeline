# Paramètres du pipeline stayphora. Les secrets ne vont JAMAIS ici : voir .env.example.
# Toute valeur absente reprend la valeur par défaut définie dans pipeline/config.py.

# Dossier de travail (work_dir/<slug>/...). null = automatique :
#   Windows : C:/stayphora-work   (hors OneDrive : des Go d'images et de .ply)
#   Linux   : /workspace/work     (pod RunPod)
# La variable d'environnement STAYPHORA_WORK_DIR a priorité.
work_dir: null

frames:                      # étape 2 — sharp-frames
  fps: 10                    # images extraites par seconde de vidéo avant sélection
  num_frames: 400            # images nettes conservées
  min_buffer: 3              # écart minimal (en images) entre deux images retenues
  selection_method: best-n
  width: 1920                # redimensionnement (0 = taille d'origine ; la 4K ralentit tout)
  format: jpg
  min_frames: 100            # en dessous : arrêt (vidéo trop courte ou trop floue)

colmap:                      # étape 3 — poses caméra
  binary: colmap
  camera_model: SIMPLE_RADIAL
  use_gpu: true
  sequential_overlap: 15     # nb d'images voisines appariées
  loop_detection: false      # true = détecte les retours dans une pièce (nécessite vocab_tree_path)
  vocab_tree_path: null      # arbre de vocabulaire, cf. https://demuc.de/colmap/
  global_min_ratio: 0.90     # global_mapper accepté si >= 90 % d'images alignées
  min_ratio: 0.70            # sinon mapper incrémental ; en dessous de 70 % : arrêt
  # Une image ne compte comme « alignée » (seuils ci-dessus, entraînement) que si elle observe
  # au moins min_image_points3d points 3D et n'est pas à plus de max_camera_distance_ratio fois
  # la distance médiane des caméras (le global_mapper garde des poses absurdes sans point 3D).
  min_image_points3d: 15
  max_camera_distance_ratio: 10.0

alignment:                   # mise à l'échelle et orientation (repère du viewer du site)
  camera_height_m: 1.5       # hauteur moyenne du téléphone pendant le tournage
  floor_percentile: 2.0      # le sol = ce centile des hauteurs des points COLMAP
  min_up_consistency: 0.8    # cohérence des verticales caméra (1 = parfaite)
  align_walls: true          # tourne la scène pour aligner les murs sur les axes X/Z
  # Corrections manuelles, appliquées APRÈS l'estimation automatique (null = aucune).
  # Valeurs estimées : state.json -> steps.3.metrics.alignment_estimated.
  # Appliquées à l'étape 5 : relancer avec --from-step 5 (COLMAP n'est pas refait).
  override:
    scale_factor: null       # multiplie l'échelle auto (ex. 1.1 si la scène paraît 10 % trop petite)
    yaw_deg: null            # rotation supplémentaire autour de Y, en degrés
    floor_offset_m: null     # décalage vertical en mètres (ex. 0.1 si le sol apparaît à y = -0,1)

train:                       # étape 4 — gsplat (examples/simple_trainer.py, stratégie MCMC)
  python: python
  trainer: /opt/gsplat/examples/simple_trainer.py
  cap_max: 1000000           # nb max de gaussiennes (cible site : <= 1 M)
  guard:                     # garde-fou : arrêt si l'entraînement diverge (pipeline/train_guard.py)
    enabled: true
    checkpoints: [1000, 3000]  # contrôles (un .ply partiel est écrit à ces itérations)
    loss_rise_ratio: 1.3       # perte médiane > 1,3 x son minimum ...
    loss_rise_min: 0.03        # ... et > minimum + 0,03
    max_dead_fraction: 0.5     # > 50 % des gaussiennes relocalisées en un cycle
    min_gaussians_ratio: 0.5   # gaussiennes < 50 % de leur maximum
    scene_scale_range: [0.5, 10.0]  # échelle de scène gsplat (contrôlée dès le démarrage)
  max_steps: 30000
  data_factor: 1
  test_every: 8              # 1 image sur 8 mise de côté (non entraînée) pour PSNR/SSIM/LPIPS
  extra_args: []             # options supplémentaires passées telles quelles au trainer

export:                      # étape 5 — splat-transform
  splat_transform: splat-transform
  min_opacity: 0.05          # opacité RÉELLE (0..1) : splat-transform v3 filtre en linéaire
  crop_box: null             # [xmin,ymin,zmin,xmax,ymax,zmax] en mètres (repère aligné), optionnel
  variants:
    normal:
      suffix: ""
      max_splats: 1000000
      max_mb: 16
      sh_bands: 2            # réduit automatiquement (2 -> 1 -> 0) si le fichier dépasse max_mb
    mobile:
      suffix: "-mobile"
      max_splats: 500000
      max_mb: 8
      sh_bands: 0

quality:                     # contrôle visuel automatique (pipeline/quality.py, rendu gsplat)
  enabled: true
  train_views: 3             # vues d'entraînement rendues en PNG (photo | rendu), étapes 4 et 5
  max_psnr_drop_db:          # arrêt si le PSNR de test du .spz relu baisse de plus que ça
    normal: 1.5              # par rapport au .ply entraîné (valeurs provisoires, à calibrer)
    mobile: 4.0
  sheet_size: 640x480        # planche 4 vues depuis le point de départ (jointe à l'e-mail)
  sheet_fov_deg: 70

publish:                     # étape 6 — Cloudflare R2
  bucket: stayphora-assets
  prefix: tours/
  assets_url: https://assets.stayphora.fr
  tours_url: https://visite.stayphora.fr
  cache_control: "public, max-age=3600"

tour_entry:                  # étape 7 — objet Tour à coller dans content/fr/tours.ts
  bounds_percentile: 2.0     # ignore les splats extrêmes (vue par les fenêtres, flotteurs)
  bounds_margin_m: 0.3       # recul par rapport aux murs
  bounds_y: [1.0, 2.2]       # hauteur de caméra autorisée (comme les scènes existantes)
  eye_height_m: 1.6

runpod:                      # lu uniquement par scripts/runpod_job.py (pas envoyé au pod)
  # GPU acceptables, par ordre de préférence. Le script prend le premier disponible (CUDA >= 12.8
  # libre) sous max_price_per_hour, et si la création échoue, essaie le suivant. Jamais au-delà.
  # L'image est compilée pour sm_86/89/120 : PAS d'A100 (sm_80), H100/H200 (sm_90), B200 (sm_100).
  # Liste construite depuis le catalogue RunPod (>= 24 Go, <= 0,75 $/h, CUDA >= 12.8) le 2026-11-20 :
  # Secure d'abord (IP publique), puis Community ; Ampere/Ada avant Blackwell ; prix croissant.
  # confirm: true -> jamais créé sans --confirm-gpu "<id>" (Blackwell : image jamais testée dessus).
  gpus:  # Ampere/Ada (lancement direct) AVANT tout Blackwell (confirmation obligatoire)
    - {id: "NVIDIA RTX A5000", cloud: SECURE}                                           # Ampere 24 Go
    - {id: "NVIDIA GeForce RTX 3090 Ti", cloud: SECURE}                                 # Ampere 24 Go
    - {id: "NVIDIA GeForce RTX 3090", cloud: SECURE}                                    # Ampere 24 Go
    - {id: "NVIDIA A40", cloud: SECURE}                                                 # Ampere 48 Go
    - {id: "NVIDIA RTX A6000", cloud: SECURE}                                           # Ampere 48 Go
    - {id: "NVIDIA L40", cloud: SECURE}                                                 # Ada 48 Go
    - {id: "NVIDIA RTX 5000 Ada Generation", cloud: SECURE}                             # Ada 32 Go
    - {id: "NVIDIA GeForce RTX 4090", cloud: SECURE}                                    # Ada 24 Go
    - {id: "NVIDIA RTX A5000", cloud: COMMUNITY}                                        # Ampere 24 Go
    - {id: "NVIDIA GeForce RTX 3090", cloud: COMMUNITY}                                 # Ampere 24 Go
    - {id: "NVIDIA GeForce RTX 3090 Ti", cloud: COMMUNITY}                              # Ampere 24 Go
    - {id: "NVIDIA RTX A6000", cloud: COMMUNITY}                                        # Ampere 48 Go
    - {id: "NVIDIA GeForce RTX 4090", cloud: COMMUNITY}                                 # Ada 24 Go
    - {id: "NVIDIA A40", cloud: COMMUNITY}                                              # Ampere 48 Go
    - {id: "NVIDIA RTX 5000 Ada Generation", cloud: COMMUNITY}                          # Ada 32 Go
    - {id: "NVIDIA L40", cloud: COMMUNITY}                                              # Ada 48 Go
    - {id: "NVIDIA RTX 6000 Ada Generation", cloud: COMMUNITY}                          # Ada 48 Go
    - {id: "NVIDIA L40S", cloud: COMMUNITY}                                             # Ada 48 Go
    - {id: "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition", cloud: SECURE, confirm: true}# Blackwell 96 Go (prix anormalement bas)
    - {id: "NVIDIA RTX PRO 4000 Blackwell", cloud: SECURE, confirm: true}               # Blackwell 24 Go
    - {id: "NVIDIA RTX PRO 4500 Blackwell", cloud: SECURE, confirm: true}               # Blackwell 32 Go
    - {id: "NVIDIA RTX PRO 4500 Blackwell Server Edition", cloud: SECURE, confirm: true}# Blackwell 32 Go
    - {id: "NVIDIA RTX PRO 5000 Blackwell", cloud: SECURE, confirm: true}               # Blackwell 48 Go
    - {id: "NVIDIA RTX PRO 4500 Blackwell", cloud: COMMUNITY, confirm: true}            # Blackwell 32 Go
    - {id: "NVIDIA RTX PRO 4000 Blackwell", cloud: COMMUNITY, confirm: true}            # Blackwell 24 Go
    - {id: "NVIDIA RTX PRO 4500 Blackwell Server Edition", cloud: COMMUNITY, confirm: true}# Blackwell 32 Go
    - {id: "NVIDIA GeForce RTX 5090", cloud: COMMUNITY, confirm: true}                  # Blackwell 32 Go
    - {id: "NVIDIA RTX PRO 5000 Blackwell", cloud: COMMUNITY, confirm: true}            # Blackwell 48 Go
  max_price_per_hour: 1.00
  max_hours: 3.0             # timeout : le pod se supprime de lui-même au-delà
  disk_gb: 60
  image: ghcr.io/barbeauaxel/stayphora-pipeline:0.1.0

notify:                      # étape 8 — e-mail via Resend
  enabled: true
  to: contact@stayphora.fr
  from: "Stayphora Pipeline <pipeline@stayphora.fr>"   # domaine à vérifier dans Resend
