[project]
name = "stayphora-pipeline"
version = "0.1.0"
description = "Vidéo de logement -> scène 3D Gaussian Splatting (.spz) publiée sur Cloudflare R2"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
    "requests>=2.31",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Extraction d'images (nécessite ffmpeg/ffprobe dans le PATH).
frames = ["sharp-frames==0.4.0"]
# Pilotage RunPod depuis le PC local.
runpod = ["runpod>=1.7"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline", "pipeline.steps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
